<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="../bird.svg"><title>Bird model visual review (development only)</title><style>body{margin:0;background:#a8b9b3}canvas{display:block;width:100vw;height:100vh}</style></head><body><script type="module">
import * as THREE from 'three/webgpu';
import {createBird} from '../src/bird.js';
const renderer=new THREE.WebGPURenderer({antialias:true,forceWebGL:true});await renderer.init();renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0xa8b9b3);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),model=createBird(),camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,30);scene.add(model.bird);scene.add(new THREE.HemisphereLight(0xe0edf2,0x53604b,2));const sun=new THREE.DirectionalLight(0xffefd3,2.5);sun.position.set(-3,5,4);scene.add(sun);
window.birdReview={pose(view='chase',time=0,pitch=0,bank=0){model.update({x:0,y:0,z:0,yaw:0,pitch,bank,speed:12,time});const positions={chase:[0,1.7,5.5],front:[2,1.3,-4.8],top:[0,6,.001],side:[4,.65,-.15]};camera.position.set(...positions[view]);camera.lookAt(0,0,0);renderer.render(scene,camera);return {...renderer.info.render};},stats(){let triangles=0,meshes=0;model.bird.traverse(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;}});return {triangles,meshes};}};window.birdReview.pose();
</script></body></html>
