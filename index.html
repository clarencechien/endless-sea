<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#7d9b9e"><link rel="icon" href="/favicon.svg"><title>Endless Sea — 向海平線飛去</title></head>
<body>
<canvas id="world" aria-label="即時 3D 海洋與飛行場景"></canvas>
<div class="grain"></div>
<header>
  <a class="brand" href="./" aria-label="Endless Sea 首頁"><svg viewBox="0 0 36 36" fill="none"><path d="M3 23c5-8 9-8 15 0s10 8 15 0M3 16c5-8 9-8 15 0s10 8 15 0" stroke="currentColor" stroke-width="1.6"/><circle cx="27" cy="7" r="2" fill="currentColor"/></svg><span>ENDLESS SEA</span></a>
  <div class="chapter"><span class="live-dot"></span><select id="chapter-select" aria-label="選擇章節"><option value="1">01 · 海與天空</option><option value="2">02 · 海島</option><option value="3">03 · 峽灣回聲</option><option value="4">04 · 極地漂流</option><option value="5">05 · 火山餘燼</option></select></div>
  <nav><button id="fullscreen" class="icon-button" aria-label="進入全螢幕" title="進入全螢幕"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><button id="sound" class="icon-button" aria-label="開啟環境音" title="配樂、飛機、風與海浪聲"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5ZM16 9l5 6m0-6-5 6"/></svg></button><button id="settings" class="icon-button" aria-label="設定" title="設定"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/></svg></button><button id="help" class="outline-button">指南</button></nav>
</header>
<main>
<section id="intro" class="intro">
  <h1>向海平線，<br><em>慢慢飛。</em></h1>
  <p>不必趕路，讓風帶你走。</p>
  <button id="fly" class="fly-button"><svg viewBox="0 0 24 24"><path d="m21 3-7 18-4-8-8-4 19-6ZM10 13 21 3"/></svg> 開始飛行<b>↗</b></button>
  <div class="intro-note"><span class="key tiny">W</span><span class="key tiny">A</span><span class="key tiny">S</span><span class="key tiny">D</span><span>駕駛，或讓風帶你走。</span></div>
</section>
<div id="flying-note" class="flying-note" hidden>不必急著抵達。</div>
<div class="time-picker" aria-label="選擇天空時刻"><button data-time="morning" title="晨光" aria-label="晨光"><span class="time-orb morning"></span></button><button data-time="golden" class="selected" title="金色時刻" aria-label="金色時刻"><span class="time-orb golden"></span></button><button data-time="blue" title="藍調時刻" aria-label="藍調時刻"><span class="time-orb blue"></span></button><button data-time="night" title="星夜" aria-label="星夜"><span class="time-orb night"></span></button><i></i><span id="time-label">夕照</span></div>
<div class="journey-panel"><div class="dream-label">發呆 <strong id="dream-beats" role="img" aria-label="0">0000</strong> 拍</div><span id="world-time">17:00 · 第 1 日</span></div>
<div class="horizon-cross">+</div>
</main>
<footer>
  <div class="flight-status"><span class="status-dot"></span><div id="mode-label">準備出發</div></div>
  <div class="instruments"><div class="instrument"><span>高度</span><strong><span id="altitude" class="instrument-digits" role="img" aria-label="128">128</span><small>M</small></strong></div><div class="instrument compass-instrument"><span>航向</span><strong><span id="heading" class="instrument-digits" role="img" aria-label="0">000</span><small>°</small></strong></div><div class="instrument"><span>空速</span><strong><span id="airspeed" class="instrument-digits" role="img" aria-label="86">086</span><small>KT</small></strong></div></div>
  <button id="autopilot" class="autopilot active" aria-pressed="true"><span>自動巡航</span><span class="toggle"><i></i></span></button>
</footer>
<div class="bottom-line"><button id="hide-ui">隱藏介面 <kbd>H</kbd></button></div>
<div id="settings-panel" class="popover" hidden><div class="panel-title">設定<button class="close-panel" aria-label="關閉設定">×</button></div><label>畫質<select id="quality"><option value="1">標準</option><option value="1.5" selected>細緻</option><option value="2">極細緻</option></select></label><label>風力 <input id="wind" type="range" min="0.3" max="1.6" step="0.1" value="0.8"></label><div class="tilt-settings"><h3>手機體感</h3><p id="tilt-status" role="status">以舒服的握姿開始飛行。</p><button id="tilt-toggle" class="outline-button" aria-pressed="false">啟用體感</button><button id="tilt-calibrate" class="outline-button" disabled>重新校準</button></div><div class="mixer"><p id="sound-status" role="status">點喇叭，聽聽海。</p><label>配樂<input data-mix="music" aria-label="配樂音量" type="range" min="0" max="1" step="0.05" value="0.65"></label><label>引擎<input data-mix="engine" aria-label="飛機音量" type="range" min="0" max="1" step="0.05" value="0.35"></label><label>風聲<input data-mix="wind" aria-label="風聲音量" type="range" min="0" max="1" step="0.05" value="0.55"></label><label>海浪<input data-mix="sea" aria-label="海聲音量" type="range" min="0" max="1" step="0.05" value="0.6"></label><button id="download-midi" class="outline-button">下載配樂 MIDI ↗</button></div></div>
<dialog id="guide"><button id="close-guide" aria-label="關閉指南">×</button><h2>輕輕飛，就好。</h2><p><span class="desktop-guide">用鍵盤轉向，或開啟自動巡航。</span><span class="mobile-guide">握好手機，輕輕傾斜。<br>想休息時，開啟自動巡航。</span></p><div class="control-row desktop-guide"><span><kbd>W</kbd> <kbd>S</kbd></span><span>壓低機頭 / 拉起爬升</span></div><div class="control-row desktop-guide"><span><kbd>A</kbd> <kbd>D</kbd></span><span>向左 / 向右轉彎</span></div><div class="control-row desktop-guide"><span><kbd>↑</kbd> <kbd>↓</kbd></span><span>增加 / 減少油門</span></div><div class="control-row desktop-guide"><span><kbd>P</kbd></span><span>切換自動巡航</span></div><div class="control-row desktop-guide"><span><kbd>H</kbd></span><span>隱藏介面，專心看海</span></div><div class="control-row desktop-guide"><span><kbd>R</kbd></span><span>回到起始航線</span></div><p class="guide-foot">體感可在設定中重新校準。<br>沒有感測權限時，飛機會自動巡航。</p><button id="guide-fly" class="fly-button">開始飛行 <b>↗</b></button></dialog>
<button id="restore-ui" aria-label="顯示介面">顯示介面 <span>↗</span></button>
<div id="chapter-notice" role="status" hidden></div>
<div id="error" hidden></div>
<script type="module" src="/src/main.js"></script>
</body></html>
