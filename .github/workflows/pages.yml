name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dlc/bird-forest/package-lock.json
      - run: npm ci
      - run: npm --prefix dlc/bird-forest ci
      - run: npm test
      - run: npm run test:forest
      - run: npm run test:window
      - run: npm run build:site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page and assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time
          from html.parser import HTMLParser
          from urllib.request import urlopen
          from urllib.parse import urljoin, urlparse

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('src'):
                      self.paths.append(attrs['src'])
                  if tag == 'link' and attrs.get('rel') in ('stylesheet', 'icon'):
                      self.paths.append(attrs['href'])

          url = os.environ['SITE_URL']
          for attempt in range(12):
              try:
                  with urlopen(url, timeout=20) as response:
                      html = response.read().decode('utf-8')
                  assert '<title>Endless Sea' in html, 'Unexpected page'
                  assets = Assets()
                  assets.feed(html)
                  assert len(assets.paths) >= 3, 'Missing built assets'
                  for path in assets.paths:
                      with urlopen(urljoin(url, path), timeout=20) as response:
                          assert response.status == 200 and response.read(1), path
                  for route, title in [('forest/', 'Bird Forest'), ('forest/upstream/', 'Nanite'), ('window/', '世界之窗')]:
                      page_url = urljoin(url, route)
                      with urlopen(page_url, timeout=20) as response:
                          page_html = response.read().decode('utf-8')
                      assert title in page_html, f'Unexpected page: {route}'
                      route_assets = Assets()
                      route_assets.feed(page_html)
                      for path in route_assets.paths:
                          if path.startswith('data:') or urlparse(urljoin(page_url, path)).netloc != urlparse(page_url).netloc:
                              continue
                          with urlopen(urljoin(page_url, path), timeout=20) as response:
                              assert response.status == 200 and response.read(1), path
                  for asset in ['assets/venice.webp', 'assets/coast.webp', 'assets/meadow.webp', 'assets/venice-depth.png', 'assets/coast-depth.png', 'assets/meadow-depth.png', 'assets/sources.json', 'assets/lake.webp', 'assets/lake-depth.png', 'assets/lake-still.webp', 'assets/lake-LICENSE.txt', 'assets/wood.svg', 'assets/linen.svg', 'assets/plaster.svg', 'renderer.js', 'room.js', 'vendor/three.module.min.js', 'vendor/three.core.min.js', 'vendor/THREE-LICENSE.txt', 'solar.js', 'scenes.js', 'credits.html']:
                      with urlopen(urljoin(url, 'window/' + asset), timeout=20) as response:
                          assert response.status == 200 and response.read(1), asset
                  print(f'Ocean, Bird Forest, upstream and World Window pages/assets verified: {url}')
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          PY
